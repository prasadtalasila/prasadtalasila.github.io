   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="82.575" y="55.807312" transform="rotate(-0 82.575 55.807312)">1. Ingest</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(32.613891 112.39581)">accept + stamp broker</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(35.28982 123.129503)">time + durable buffer</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="216.495" y="55.889344" transform="rotate(-0 216.495 55.889344)">2. Validate</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(162.013289 112.39581)">reject/quarantine what is</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(176.868539 123.129503)">structurally wrong</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="350.415" y="55.889344" transform="rotate(-0 350.415 55.889344)">3. Clean</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(295.664813 107.028963)">handle what is physically</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(292.73332 117.762656)">suspicious (outliers, stuck,</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(338.262867 128.496349)">gaps)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="484.335" y="55.889344" transform="rotate(-0 484.335 55.889344)">4. Transform</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(444.026133 112.39581)">units, coordinates,</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(434.776266 123.129503)">canonical names, joins</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(592.218281 49.412115)">5. Enrich</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(593.158359 62.366572)">&amp; derive</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(569.120391 112.39581)">residuals, rolling stats,</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(568.853273 123.129503)">health indices -&gt; store</text>
   </g>
   <g id="text_11">
    <text style="font-style: italic; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(169.106141 172.518003)">Stages 2 and 3 must stay separate: a validation failure means “this message is broken,”</text>
    <text style="font-style: italic; font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(152.129203 182.148122)">a cleaning failure means “this measurement is implausible” — different people respond to each.</text>
   </g>
  </g>
 </g>
