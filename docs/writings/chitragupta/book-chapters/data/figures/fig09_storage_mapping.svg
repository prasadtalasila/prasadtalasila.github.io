   <g id="text_1">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937" x="326.7" y="31.172359" transform="rotate(-0 326.7 31.172359)">One twin, several databases: data category determines store type</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(79.155703 79.583927)">Telemetry, residuals,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(94.048594 90.687748)">derived series</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(493.637344 74.032017)">Time-series DB</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(464.710078 85.135838)">append-heavy, time-ranged</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(487.506797 96.239658)">queries, retention</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(76.688437 126.707927)">Configuration, assets,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(92.982656 137.811748)">batches, users</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(497.268984 121.156017)">Relational DB</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(480.694219 132.259837)">integrity constraints,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(486.50625 143.363658)">joins, transactions</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(75.293437 173.831927)">Twin state documents,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(83.012344 184.935748)">model descriptions</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(491.457656 168.280017)">Document store</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(486.666562 179.383837)">schema flexibility,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(474.308437 190.487658)">whole-object read/write</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(85.765078 220.955927)">CAD, images, raw</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(64.880859 232.059748)">waveforms, model binaries</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(500.113828 215.404017)">Object store</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(482.977969 226.507837)">large opaque blobs,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(484.894687 237.611658)">cheap, versionable</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(64.040625 268.079927)">Relationships: composition,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(67.710938 279.183748)">connectivity, dependency</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(505.794375 262.528017)">Graph DB</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(484.558594 273.631837)">multi-hop traversal</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(474.496172 284.735658)">without expensive joins</text>
   </g>
  </g>
 </g>
