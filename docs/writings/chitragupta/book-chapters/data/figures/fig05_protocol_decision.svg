   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="329.49" y="40.602328" transform="rotate(-0 329.49 40.602328)">1. Latency budget?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(87.268594 96.945245)">milliseconds,</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(76.054102 108.419193)">hard determinism</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(291.3135 96.945245)">seconds and up:</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(294.040289 108.419193)">continue below</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(511.278117 96.945245)">device sleeps,</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(505.669781 108.419193)">battery-powered</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(87.156875 162.019057)">DDS  /  TSN</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(42.966289 173.739756)">(local broker, deterministic)</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(496.019578 162.014589)">CoAP  (UDP, single</text>
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(473.029688 173.561193)">round trip, sleepy-friendly)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.7px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(260.932219 159.065196)">2. How many consumers,</text>
    <text style="font-weight: 700; font-size: 9.7px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(290.597547 171.108429)">do they grow?</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(234.459258 225.843245)">fixed, single</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(239.509594 237.317193)">consumer</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(405.211617 225.843245)">unknown / growing</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(424.017234 237.317193)">consumers</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(233.186875 288.145057)">HTTP/REST</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(211.303477 299.865756)">(request/response)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(405.299844 288.145057)">MQTT  (pub/sub,</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(419.556523 299.865756)">decoupled)</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(392.317313 349.40181)">backend needs durable</text>
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(393.917297 360.135503)">queues / transactions?</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #7c3aed" transform="translate(552.69 350.011189)">-&gt; AMQP for the</text>
    <text style="font-weight: 700; font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #7c3aed" transform="translate(552.69 359.305373)">backend/enterprise side</text>
   </g>
   <g id="text_14">
    <text style="font-style: italic; font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(156.74925 397.106794)">Every interface still needs Section 5.5's full checklist (power, semantics, security);</text>
    <text style="font-style: italic; font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(205.025625 406.512956)">this tree captures only the two highest-leverage questions.</text>
   </g>
